name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build_apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Publish build log (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ci-log "$GITHUB_WORKSPACE/build.log" --title "CI build log" --notes "latest failing build log" \
          || gh release upload ci-log "$GITHUB_WORKSPACE/build.log" --clobber

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snshubcl-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest android/app/build/outputs/apk/debug/app-debug.apk \
            --title "SNS Hub (latest)" \
            --notes "멀티 SNS 브라우저/런처 (다크모드, 한/영, 자동화 없음) - 최신 debug APK (v1.0)" \
          || gh release upload latest android/app/build/outputs/apk/debug/app-debug.apk --clobber
